<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06060c" />
      <stop offset="0.45" stop-color="#0c0a18" />
      <stop offset="1" stop-color="#05050a" />
    </linearGradient>
    <linearGradient id="ribbon1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5cff" />
      <stop offset="0.45" stop-color="#a86bff" />
      <stop offset="1" stop-color="#ff9d6b" />
    </linearGradient>
    <linearGradient id="ribbon2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6fd6" />
      <stop offset="0.55" stop-color="#7d5bff" />
      <stop offset="1" stop-color="#ff7ab8" />
    </linearGradient>
    <linearGradient id="ribbon3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb27a" stop-opacity="0.9" />
      <stop offset="1" stop-color="#8f6bff" stop-opacity="0.7" />
    </linearGradient>
    <filter id="blur-lg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="blur-xl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <g filter="url(#blur-xl)" opacity="0.55">
    <ellipse cx="260" cy="180" rx="430" ry="330" fill="#4b2fd6" />
    <ellipse cx="1330" cy="740" rx="470" ry="330" fill="#c2508a" />
    <ellipse cx="980" cy="90" rx="380" ry="220" fill="#2f6fd6" opacity="0.65" />
  </g>

  <g fill="none" stroke-linecap="round" filter="url(#blur-lg)">
    <path d="M-120 660 C 240 430, 520 800, 900 520 S 1460 250, 1720 430" stroke="url(#ribbon1)" stroke-width="150" opacity="0.72" />
    <path d="M-80 280 C 320 520, 660 170, 1000 380 S 1520 640, 1700 470" stroke="url(#ribbon2)" stroke-width="86" opacity="0.6" />
    <path d="M-60 840 C 420 640, 780 910, 1140 700 S 1580 560, 1720 660" stroke="url(#ribbon3)" stroke-width="54" opacity="0.42" />
  </g>

  <g fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M-120 660 C 240 430, 520 800, 900 520 S 1460 250, 1720 430" stroke="url(#ribbon1)" stroke-width="26" />
    <path d="M-80 280 C 320 520, 660 170, 1000 380 S 1520 640, 1700 470" stroke="url(#ribbon2)" stroke-width="14" />
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.06" />
</svg>
