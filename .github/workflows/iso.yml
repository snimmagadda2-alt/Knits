name: Build live ISO

# The ISO is built here rather than on Vercel: it needs debootstrap, a chroot and
# about a gigabyte of packages, none of which a static site build can do.
# Run it by hand from the Actions tab, or push a v* tag.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    # A change to the image itself should publish a new one without anyone having to
    # remember the Actions tab. Ordinary app pushes do not rebuild the ISO.
    branches:
      - main
    paths:
      - 'packaging/iso/**'
      - 'scripts/build-iso.sh'
      # The image installs the current .deb, so a new app version ships a new ISO.
      # Ordinary fixes between releases do not rebuild a gigabyte image.
      - 'package.json'
      - 'public/downloads/knits_all.deb'
      - '.github/workflows/iso.yml'

permissions:
  contents: write

concurrency:
  group: iso
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build the app bundle and the .deb
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Debian 12, not the Ubuntu runner: the image is Debian, and Ubuntu's live-build
      # asks for the wrong suite from the Ubuntu archive and cannot read Debian's keyring.
      - name: Build the ISO in Debian 12
        run: |
          docker run --rm --privileged \
            -v "$PWD:/build" -w /build \
            debian:bookworm bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso \
                syslinux syslinux-common isolinux \
                grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
                ca-certificates gnupg
              bash scripts/build-iso.sh
            '

      - name: Publish to the "iso" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view iso >/dev/null 2>&1 ||
            gh release create iso \
              --title "Knits live ISO" \
              --notes "Bootable Debian image that starts straight into Knits. Built from $GITHUB_SHA." \
              --latest=false
          gh release upload iso \
            dist/knits-amd64.iso \
            dist/knits-*.iso.sha256 \
            --clobber

      - name: Keep the image as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knits-iso
          path: |
            dist/knits-*.iso
            dist/knits-*.iso.sha256
          if-no-files-found: error
